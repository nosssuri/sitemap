name: Deploy static site to Pages

on:
  push:
    branches: [main]   # 実際のデフォルトブランチに合わせる（master等）
  workflow_dispatch:    # Actionsタブから手動実行も可能に

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの衝突を防ぐ
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .          # リポジトリ直下を丸ごと配信（Jekyll処理なし）
      - id: deployment
        uses: actions/deploy-pages@v4
